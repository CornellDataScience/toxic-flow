[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toxicflow"
version = "0.1.0"
description = "Kraken order book collection and adverse-selection (toxic flow) research"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13",
    "requests>=2.31",
    "certifi",
    "python-dotenv>=1.0",
    "sortedcontainers>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["toxicflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
